name: PR Check

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened] # ignores merged events

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build Next.js
        run: npm run build