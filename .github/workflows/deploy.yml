name: Node.js Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    env:
      NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_API_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STRIPE_SECRET_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_BACKEND_API: ${{ secrets.NEXT_PUBLIC_BACKEND_API }}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}

    steps:
      # 1. Checkout (required for hashFiles)
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Prepare /app folder (self-healing)
      - name: Prepare app folder
        run: |
          if [ ! -d "/var/www/html/rs-web-admin/app/.git" ]; then
            echo "📁 /app missing — cloning fresh"
            rm -rf /var/www/html/rs-web-admin/app
            git clone https://Ferujahammed:${{ secrets.PAT_CLONE_TOKEN }}@github.com/Ferujahammed/web-admin.git /var/www/html/rs-web-admin/app
          else
            echo "🔄 /app exists — pulling latest"
            cd /var/www/html/rs-web-admin/app
            git fetch --all
            git reset --hard origin/main
          fi

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 4. Cache node_modules
      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: /var/www/html/rs-web-admin/app/node_modules
          key: node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: node-modules-

      # 5. Install dependencies
      - name: Install dependencies
        run: |
          cd /var/www/html/rs-web-admin/app
          npm install

      # 6. Create .env file
      - name: Create .env file
        run: |
          sudo tee /var/www/html/rs-web-admin/app/.env > /dev/null <<EOF
          NEXT_PUBLIC_GOOGLE_PLACES_API_KEY=${NEXT_PUBLIC_GOOGLE_PLACES_API_KEY}
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}
          NEXT_PUBLIC_STRIPE_SECRET_KEY=${NEXT_PUBLIC_STRIPE_SECRET_KEY}
          NEXT_PUBLIC_BACKEND_API=${NEXT_PUBLIC_BACKEND_API}
          NEXT_PUBLIC_MAPBOX_TOKEN=${NEXT_PUBLIC_MAPBOX_TOKEN}
          EOF

      # 7. Build Next.js
      - name: Build Next.js
        run: |
          cd /var/www/html/rs-web-admin/app
          npm run build 2>&1 | tee build.log

      # 8. Restart PM2 (zero downtime)
      - name: Restart PM2
        run: |
          cd /var/www/html/rs-web-admin/app
          if pm2 list | grep -q rs_web_admin; then
            echo "♻️ Restarting PM2 process"
            sudo pm2 restart rs_web_admin
          else
            echo "🚀 Starting PM2 process"
            sudo pm2 start npm --name "rs_web_admin" -- start
          fi
          sudo pm2 save
