name: Next.js CI/CD Deployment

on:
  push:
    branches: ["main"]

# Single-job self-hosted deploy (no artifact upload/download → no storage quota usage).
# Builds directly on the production runner.
jobs:
  deploy:
    runs-on: self-hosted

    env:
      NEXT_PUBLIC_GOOGLE_PLACES_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_PLACES_API_KEY }}
      NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_STRIPE_SECRET_KEY: ${{ secrets.NEXT_PUBLIC_STRIPE_SECRET_KEY }}
      NEXT_PUBLIC_BACKEND_API: ${{ secrets.NEXT_PUBLIC_BACKEND_API }}
      NEXT_PUBLIC_MAPBOX_TOKEN: ${{ secrets.NEXT_PUBLIC_MAPBOX_TOKEN }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sync source to app dir
        run: |
          set -e
          APP_DIR=/var/www/html/rs-web-admin/app
          echo "📁 Preparing $APP_DIR ..."
          sudo mkdir -p $APP_DIR
          sudo chown -R $USER:$USER $APP_DIR

          echo "🔄 Syncing checkout (${{ github.sha }}) into $APP_DIR ..."
          # Preserve node_modules and .next for incremental builds; remove .git
          # so the deployed dir doesn't try to reach GitHub at runtime.
          rsync -a --delete \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.git' \
            ./ $APP_DIR/

      - name: Write .env
        run: |
          APP_DIR=/var/www/html/rs-web-admin/app
          cat <<EOF > $APP_DIR/.env
          NEXT_PUBLIC_GOOGLE_PLACES_API_KEY="${NEXT_PUBLIC_GOOGLE_PLACES_API_KEY}"
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY="${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY}"
          NEXT_PUBLIC_STRIPE_SECRET_KEY="${NEXT_PUBLIC_STRIPE_SECRET_KEY}"
          NEXT_PUBLIC_BACKEND_API="${NEXT_PUBLIC_BACKEND_API}"
          NEXT_PUBLIC_MAPBOX_TOKEN="${NEXT_PUBLIC_MAPBOX_TOKEN}"
          NEXT_PUBLIC_VAPID_PUBLIC_KEY="${NEXT_PUBLIC_VAPID_PUBLIC_KEY}"
          EOF

      - name: Install dependencies
        run: |
          cd /var/www/html/rs-web-admin/app
          npm ci

      - name: Build Next.js
        env:
          # Cap Node's heap so an OOM exits fast instead of thrashing swap forever.
          # Adjust upward if the runner has more RAM available.
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          cd /var/www/html/rs-web-admin/app
          echo "--- free -h ---"
          free -h || true
          echo "--- nproc ---"
          nproc || true
          echo "--- swapon ---"
          swapon --show || true
          NODE_ENV=production npm run build 2>&1 | tee build.log

      - name: Restart PM2
        run: |
          set -e
          cd /var/www/html/rs-web-admin/app
          echo "Deployed BUILD_ID: $(cat .next/BUILD_ID 2>/dev/null || echo 'MISSING')"

          if sudo pm2 describe rs_web_admin > /dev/null 2>&1; then
            echo "♻️ Reloading existing process..."
            sudo pm2 reload rs_web_admin --update-env
          else
            echo "🆕 Starting new process..."
            sudo pm2 start npm --name rs_web_admin -- start
          fi
          sudo pm2 save

      - name: Health check
        run: |
          sleep 5
          if ! curl -fs http://localhost:3000 > /dev/null; then
            echo "❌ Health check failed!"
            sudo pm2 logs rs_web_admin --lines 50 --nostream || true
            exit 1
          fi
          echo "✅ Deployment successful!"
